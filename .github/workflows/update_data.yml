name: Daily Premier League Data Update

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install understat aiohttp pandas duckdb pytest

      - name: Run Transformation Tests
        run: pytest

      - name: Run Data Extraction
        run: python src/extract_xg.py

      - name: Run Data Transformation
        run: python src/transform_xg.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily Premier League data update" && git push)

      - name: Ping Streamlit App (Keep-Alive)
        run: curl -s https://pl-xg-data.streamlit.app/ > /dev/null
