name: Weekly Premier League xG Pipeline

# Schedule to run automatically every Wednesday at 06:00 AM UTC
# (Gives Understat a buffer to process Monday night matches)
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install understatapi pandas duckdb

      - name: Extract current season raw xG data
        run: python src/extract_xg.py

      - name: Transform raw JSON to clean analytical metrics
        run: python src/transform_xg.py

      - name: Run analytical DuckDB queries
        run: python src/query_xg.py

      - name: Commit and push updated datasets back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/processed/epl_player_xg_2025_clean.csv
          git commit -m "auto: update weekly Premier League xG datasets" || echo "No changes to commit"
          git push